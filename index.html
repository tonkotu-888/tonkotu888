<body>
    <h1>Supabaseテストルーム</h1>
    <p>学校のPCから、お友達と同じ仕組みを作っています！</p>

    <!-- 🌟【ここを追加！】文字を入れる箱と、送信ボタン -->
    <input type="text" id="myText" placeholder="ここに入力した文字が届くよ">
    <button id="sendBtn">Supabaseへ送信！</button>

    <!-- ① Supabaseの機能を読み込む（ここは前のままでOK） -->
    <script src="https://jsdelivr.net"></script>

    <script>
      // ②【ここはあなたの暗号のまま！】
      const SUPABASE_URL = 'https://edkdvklzquizwycdoxon.supabase.co';
      const SUPABASE_KEY = 'lsb_pubishable_z7MPOr7nfYBHlC7qxOV10g_ldGlwomT';

      // データベースと合体！
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // 🌟【ここを新しく追加！】ボタンを押したときにデータをSupabaseに送る命令
      document.getElementById('sendBtn').addEventListener('click', async () => {
          const textValue = document.getElementById('myText').value;
          
          // Supabaseの「test_data」テーブルに文字を追加する
          const { data, error } = await supabase
              .from('test_data')
              .insert([ { content: textValue } ]);

          if (error) {
              alert('エラーが発生しました：' + error.message);
          } else {
              alert('Supabaseへ送信大成功！お友達の仕組みが完成したよ！');
          }
      });
    </script>
</body>
