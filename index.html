<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Windows 11</title>
    <style>
        /* --- 全体のデザイン (CSS) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #4a777a; /* 読み込み前の保険用カラー */
        }
        /* 【変更】デスクトップの背景を指定されたWindows 11の壁紙に設定 */
        .desktop {
            width: 100%;
            height: calc(100% - 40px);
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 20px;
        }
        /* デスクトップアイコン */
        .icon {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: white;
            font-size: 12px;
            cursor: pointer;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            padding: 10px 5px;
            border-radius: 4px;
        }
        .icon:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
        .icon-img {
            font-size: 32px;
            margin-bottom: 5px;
        }
        /* ウィンドウのデザイン */
        .window {
            position: absolute;
            top: 100px;
            left: 150px;
            width: 450px;
            height: 300px;
            background-color: rgba(243, 243, 243, 0.95);
            backdrop-filter: blur(10px); /* Windows11風のすりガラス効果 */
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            display: none;
            flex-direction: column;
            border-radius: 8px; /* 角を少し丸く */
            overflow: hidden;
            z-index: 10;
        }
        /* ウィンドウのタイトルバー */
        .title-bar {
            background-color: rgba(28, 151, 234, 0.9);
            color: white;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            font-size: 14px;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .close-btn:hover {
            background-color: #e81123;
        }
        /* ウィンドウの中身 */
        .window-content {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            color: #333;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.9);
        }
        /* タスクバー */
        .taskbar {
            width: 100%;
            height: 40px;
            background-color: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(12px);
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .taskbar-left {
            display: flex;
            align-items: center;
            height: 100%;
        }
        /* スタートボタン */
        .start-button {
            width: 48px;
            height: 100%;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start-button:hover {
            background-color: rgba(255,255,255,0.1);
        }
        /* タスクバーの時計 */
        .clock {
            color: white;
            font-size: 12px;
            text-align: right;
        }
        /* スタートメニュー */
        .start-menu {
            position: absolute;
            bottom: 48px;
            left: 10px;
            width: 280px;
            background-color: rgba(25, 25, 25, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            padding: 12px 0;
            z-index: 99;
        }
        .menu-item {
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-item:hover {
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <!-- デスクトップエリア -->
    <div class="desktop" id="desktop">
        <!-- Supabaseアプリのアイコン -->
        <div class="icon" id="appIcon">
            <div class="icon-img">⚡</div>
            <div>Supabase App</div>
        </div>

        <!-- 動くウィンドウ -->
        <div class="window" id="myWindow">
            <div class="title-bar" id="titleBar">
                <span>Supabase Dashboard</span>
                <button class="close-btn" id="closeBtn">×</button>
            </div>
            <div class="window-content">
                <h3>自作のWindows 11環境へようこそ！</h3>
                <p style="margin-top: 10px;">リクエストされた美しいBloom壁紙がセットされました。</p>
                <p style="margin-top: 10px; color: #00875a; font-weight: bold;">⚡ Supabase Status: Ready</p>
                <button style="margin-top: 15px; padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: white;">接続テスト</button>
            </div>
        </div>
    </div>

    <!-- スタートメニュー -->
    <div class="start-menu" id="startMenu">
        <div class="menu-item" id="menuOpenApp">⚡ <span>Supabaseを開く</span></div>
        <div class="menu-item" onclick="alert('設定画面（ダミー）');">⚙️ <span>設定</span></div>
        <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 6px 0;">
        <div class="menu-item" onclick="location.reload();">🔄 <span>再起動</span></div>
    </div>

    <!-- タスクバー -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="start-button" id="startButton">🪟</div>
        </div>
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <script>
        /* --- 動きを作る処理 (JavaScript) --- */
        const myWindow = document.getElementById('myWindow');
        const startMenu = document.getElementById('startMenu');
        const desktop = document.getElementById('desktop');

        // 1. ウィンドウを開閉する機能
        document.getElementById('appIcon').addEventListener('click', () => {
            myWindow.style.display = 'flex';
        });
        document.getElementById('closeBtn').addEventListener('click', () => {
            myWindow.style.display = 'none';
        });

        // 2. スタートメニューの表示切り替え
        document.getElementById('startButton').addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.style.display = (startMenu.style.display === 'flex') ? 'none' : 'flex';
        });

        document.getElementById('menuOpenApp').addEventListener('click', () => {
            myWindow.style.display = 'flex';
            startMenu.style.display = 'none';
        });

        desktop.addEventListener('click', (e) => {
            if (!startMenu.contains(e.target)) {
                startMenu.style.display = 'none';
            }
        });

        // 3. ウィンドウをマウスでドラッグして動かす機能
        const titleBar = document.getElementById('titleBar');
        let isDragging = false;
        let offsetX, offsetY;

        titleBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - myWindow.offsetLeft;
            offsetY = e.clientY - myWindow.offsetTop;
            myWindow.style.zIndex = 100;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            myWindow.style.left = `${e.clientX - offsetX}px`;
            myWindow.style.top = `${e.clientY - offsetY}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // 4. 時計の更新
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ja-JP');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
